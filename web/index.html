<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta id="theme-color-meta" name="theme-color" content="#cc0033" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>RUAB Sniper</title>
    <script>
      // Applies the saved light/dark/system choice before first paint, so
      // there's no flash of the wrong theme while React boots. Keep this in
      // sync with src/lib/theme.ts (STORAGE_KEY + the same resolution logic)
      // if that file ever changes.
      (function () {
        try {
          var pref = localStorage.getItem("ruabsniper:theme");
          if (pref === "light" || pref === "dark") {
            document.documentElement.setAttribute("data-theme", pref);
          }
        } catch (e) {
          // Storage inaccessible (private mode, etc.) — fall back to system
          // preference via the CSS media query, same as a fresh visitor.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
