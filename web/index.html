<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta id="theme-color-meta" name="theme-color" content="#cc0033" />
    <!-- Without these, "Add to Home Screen" on iOS opens the page inside
         Safari's own chrome (address bar, tab switcher) instead of a real
         standalone window -- `display: standalone` in manifest.json only
         covers Android/desktop installs. Push notifications only reach iOS
         Safari for a page installed to the home screen (see the project
         memory / README), so a half-standalone install undercuts the whole
         reason this is a PWA rather than a plain website. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RUAB Sniper" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Space Grotesk for headings/big numbers/course codes/buttons only
         (see styles.css's --font-display) -- body text stays the system
         font stack for speed and native input rendering. Preconnect first
         since this is render-blocking for anything using --font-display,
         same as any webfont. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <title>RUAB Sniper</title>
    <script>
      // Applies the saved light/dark/system choice before first paint, so
      // there's no flash of the wrong theme while React boots. Keep this in
      // sync with src/lib/theme.ts (STORAGE_KEY + the same resolution logic)
      // if that file ever changes.
      (function () {
        try {
          var pref = localStorage.getItem("ruabsniper:theme");
          if (pref === "light" || pref === "dark") {
            document.documentElement.setAttribute("data-theme", pref);
          }
        } catch (e) {
          // Storage inaccessible (private mode, etc.) — fall back to system
          // preference via the CSS media query, same as a fresh visitor.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
