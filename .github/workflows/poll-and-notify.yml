name: Poll open sections and notify

# Retired as the primary poller: GitHub Actions' free-tier scheduler was
# verified landing runs 9-21 minutes apart under its runner queue, not the
# nominal 5. web/api/poll.ts (a Vercel serverless function, triggered every
# minute by an external free cron-ping service) replaced it for real -- see
# that file's own comment for why. Kept around, manually-triggerable only,
# as a fallback if the external pinger ever lapses.
on:
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run poll-and-notify
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
