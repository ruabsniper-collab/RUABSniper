name: Build unsigned iOS IPA (for SideStore)

# No Apple Developer account anywhere in this workflow — it produces a
# code-signing-free .ipa on GitHub's free macOS runner, which SideStore
# then signs itself using your own free Apple ID at install time.
#
# workflow_dispatch only (not on every push): macOS runners burn GitHub
# Actions minutes at 10x the normal rate, so this is meant to be triggered
# by hand when you actually want a new build, not on every commit.
#
# NOTE: this is the one piece of this project I (Claude) couldn't verify
# end-to-end — I have no Mac/Xcode to test an actual archive-and-export
# run. The commands below follow the standard documented pattern for
# unsigned CI archives; if a step fails, paste me the Actions log and I'll
# fix it. Everything else in this repo was verified against live data.

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install JS dependencies
        run: npm ci
        working-directory: mobile

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean
        working-directory: mobile

      - name: Install CocoaPods dependencies
        run: npx pod-install
        working-directory: mobile

      - name: Discover workspace + scheme
        id: discover
        working-directory: mobile
        run: |
          set -euo pipefail
          WORKSPACE=$(ls ios/*.xcworkspace | head -n1)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" -json \
            | node -e '
                let d = "";
                process.stdin.on("data", c => d += c);
                process.stdin.on("end", () => {
                  const j = JSON.parse(d);
                  console.log(j.workspace.schemes.find(s => !s.includes("Pods")) || j.workspace.schemes[0]);
                });
              ')
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Discovered workspace=$WORKSPACE scheme=$SCHEME"

      - name: Archive (code signing disabled)
        working-directory: mobile
        run: |
          xcodebuild \
            -workspace "${{ steps.discover.outputs.workspace }}" \
            -scheme "${{ steps.discover.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/App.xcarchive \
            -destination "generic/platform=iOS" \
            clean archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned .ipa
        working-directory: mobile
        run: |
          set -euo pipefail
          mkdir -p build/Payload
          cp -R build/App.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r RUCourseSniper-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: RUCourseSniper-unsigned-ipa
          path: mobile/build/RUCourseSniper-unsigned.ipa
          retention-days: 30
